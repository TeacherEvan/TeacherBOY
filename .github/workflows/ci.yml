name: Main CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: main-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-type:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/pyproject.toml', '**/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.4.8 mypy==1.7.1 pytest==7.4.3 pytest-asyncio==0.21.1 pytest-cov==4.1.0
      - name: Ruff lint
        run: ruff check src/ tests/
      - name: Ruff format check
        run: ruff format --check src/ tests/
      - name: Mypy
        run: mypy src || true

  unit-test:
    name: Unit tests
    needs: lint-and-type
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/pyproject.toml', '**/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==7.4.3 pytest-asyncio==0.21.1 pytest-cov==4.1.0
      - name: Run pytest
        env:
          LINE_CHANNEL_SECRET: test_secret
          LINE_CHANNEL_ACCESS_TOKEN: test_token
        run: pytest -v --tb=short

  docker-build:
    name: Validate Docker build
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: teacherboy:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Hugging Face
    needs: [unit-test, docker-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote remove hf >/dev/null 2>&1 || true
          git remote add hf "https://TeacherEvan:${HF_TOKEN}@huggingface.co/spaces/EvilEvan/TeacherBOY" || true

          git ls-remote hf >/dev/null 2>&1 || { echo "Missing HF_TOKEN or bad remote"; exit 1; }

          remote_sha="$(git ls-remote hf refs/heads/main | awk '{print $1}')"
          if [ -n "${remote_sha}" ]; then
            git push --force-with-lease=refs/heads/main:${remote_sha} hf HEAD:main
          else
            git push hf HEAD:main
          fi

  # Best-practice CI failure→issue trigger.
  # Fires only when the lint/format/type gate fails (merge stays blocked on main),
  # opens a deduplicated GitHub issue and records what the agent should do.
  lint-failure-issue:
    name: Open issue on lint failure
    needs: lint-and-type
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update CI failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const ref = context.payload.pull_request
              ? context.payload.pull_request.head.ref
              : context.ref.replace('refs/heads/', '');
            const title = `🚨 CI Lint Failure: ${ref}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.sha;
            const actor = context.actor;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((i) => i.title === title && !i.pull_request);

            const body = `## CI Lint/Format gate failed

            **Branch/ref:** \`${ref}\`
            **Commit:** \`${sha}\`
            **Triggered by:** @${actor}
            **Run:** ${runUrl}

            The \`lint-and-type\` job failed (Ruff lint, Ruff format, or Mypy). This blocks merge to \`main\` (required status check).

            ### Agent handling (auto-remediation)
            1. Reproduce locally with the **pinned** linter: \`pip install ruff==0.4.8\` then \`ruff check --fix src/ tests/ && ruff format src/ tests/\`.
            2. Commit the fix and open/refresh the fix PR.
            3. Comment resolution on this issue once the \`lint-and-type\` check is green.

            _Auto-created by the CI failure trigger._`;

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Recurred at ${runUrl} (commit \`${sha}\`, actor @${actor}).`,
              });
              console.log(`Updated existing issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ci-failure', 'lint', 'automated'],
              });
              console.log(`Created issue #${created.data.number}`);
            }
