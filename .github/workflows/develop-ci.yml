name: Develop CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: develop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-type:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/pyproject.toml', '**/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.4.8 mypy==1.7.1 pytest==7.4.3 pytest-asyncio==0.21.1 pytest-cov==4.1.0
      - name: Ruff lint
        continue-on-error: true
        run: ruff check src/ tests/

      - name: Ruff format check
        continue-on-error: true
        run: ruff format --check src/ tests/

      - name: Mypy
        run: mypy src || true

  unit-test:
    name: Unit tests
    needs: lint-and-type
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/pyproject.toml', '**/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==7.4.3 pytest-asyncio==0.21.1 pytest-cov==4.1.0
      - name: Run pytest
        env:
          LINE_CHANNEL_SECRET: test_secret
          LINE_CHANNEL_ACCESS_TOKEN: test_token
        run: pytest -v --tb=short