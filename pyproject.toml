[project]
name = "teacherboy"
version = "0.1.0"
description = "Multi-agent LINE/Telegram translation bot"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Evan Botha", email = "ewaldt.botha@gmail.com"}]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
urls = {Repository = "https://github.com/TeacherEvan/TeacherBOY", Issues = "https://github.com/TeacherEvan/TeacherBOY/issues"}
dependencies = [
    "fastapi==0.109.1",
    "uvicorn[standard]==0.24.0",
    "line-bot-sdk==3.6.0",
    "httpx[http2]==0.25.2",
    "python-dotenv==1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings==2.1.0",
    "langdetect==1.0.9",
    "holidays==0.41.0",
    "feedparser==6.0.10",
    "cachetools==5.3.0",
    "opentelemetry-api==1.29.0",
    "opentelemetry-sdk==1.29.0",
    "opentelemetry-exporter-otlp==1.29.0",
    "opentelemetry-instrumentation-fastapi==0.50b0",
    "opentelemetry-instrumentation-httpx==0.50b0",
    "opentelemetry-instrumentation-logging==0.50b0",
    "apscheduler==3.10.4",
    "pytz==2024.1",
    "python-dateutil==2.8.2",
    "dateparser==1.2.0",
    "huggingface-hub==0.23.0",
    "pypdf==4.2.0",
    "python-docx==1.1.2",
    "easyocr==1.7.1",
    "reportlab==4.2.0",
    "google-api-python-client>=2.100.0,<3.0.0",
    "google-auth-oauthlib>=1.1.0,<2.0.0",
    "google-auth-httplib2>=0.2.0,<1.0.0",
    "loguru==0.7.2",
    "instructor==1.3.0",
    "cryptography>=42.0.0,<43.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "ruff==0.4.8",
    "mypy==1.7.1",
    "pre-commit==3.6.0",
]

[tool.ruff]
target-version = "py311"
line-length = 127

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "B904"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]